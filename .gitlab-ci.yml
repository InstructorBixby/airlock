stages:
  - check

variables:
  UV_CACHE_DIR: .cache/uv

.py:
  image: python:$PY-slim
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/uv
  before_script:
    - pip install -q uv
    - uv pip install --system -e ".[dev]"

test:
  extends: .py
  stage: check
  parallel:
    matrix:
      - PY: ["3.11", "3.12", "3.13"]
  script:
    - ruff check .
    - pytest --cov=airlock --cov-report=term --cov-fail-under=88

typecheck:
  extends: .py
  stage: check
  variables:
    PY: "3.12"
  script:
    - mypy

host:
  stage: check
  tags:
    - shell
  script:
    - uv pip install -e ".[dev]"
    - pytest -q

conformance:
  # The example policy has to fail closed, checked exactly the way I
  # check an engagement policy. If the command cannot prove the file
  # in this repository, it cannot prove the one in a hurry on a
  # Thursday either.
  extends: .py
  stage: check
  variables:
    PY: "3.12"
  script:
    - airlock policy lint --policy airlock/policy.yaml
    - airlock conformance --policy airlock/policy.yaml

minimal:
  # The gateway has to start with nothing optional installed. A
  # control whose fail-closed path depends on an extra is not one.
  stage: check
  image: python:3.12-slim
  before_script:
    - pip install -q uv
    - uv pip install --system -e .
  script:
    - python -c "import airlock.api"
    - airlock --version
    - airlock conformance --policy airlock/policy.yaml

outdated:
  extends: .py
  stage: check
  variables:
    PY: "3.12"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - uv pip list --system --outdated
  allow_failure: true
