stages:
  - check
  - docs

variables:
  UV_CACHE_DIR: .cache/uv

.py:
  image: python:$PY-slim
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/uv
  before_script:
    - pip install -q uv
    - uv pip install --system -e ".[dev]"

test:
  extends: .py
  stage: check
  parallel:
    matrix:
      - PY: ["3.11", "3.12", "3.13"]
  script:
    - ruff check .
    - pytest --cov=airlock --cov-report=term --cov-fail-under=88

typecheck:
  extends: .py
  stage: check
  variables:
    PY: "3.12"
  script:
    - mypy

host:
  stage: check
  tags:
    - shell
  script:
    - uv pip install -e ".[dev]"
    - pytest -q

conformance:
  extends: .py
  stage: check
  variables:
    PY: "3.12"
  script:
    - airlock policy lint --policy airlock/policy.yaml
    - airlock conformance --policy airlock/policy.yaml

minimal:
  stage: check
  image: python:3.12-slim
  before_script:
    - pip install -q uv
    - uv pip install --system -e .
  script:
    - python -c "import airlock.api"
    - airlock --version
    - airlock conformance --policy airlock/policy.yaml

outdated:
  extends: .py
  stage: check
  variables:
    PY: "3.12"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - uv pip list --system --outdated
  allow_failure: true

# Not deployed anywhere. The artefact is so a broken link fails here
# rather than the next time I go looking for the one paragraph that
# explains what `undecided` means; day to day I read these with
# `mkdocs serve` on loopback.
docs:
  stage: docs
  image: python:3.12-slim
  before_script:
    - pip install -q uv
    - uv pip install --system -e ".[docs]"
  script:
    - mkdir -p docs/schema && cp airlock/schema/*.json docs/schema/
    - mkdocs build --strict
  artifacts:
    paths:
      - site/
    expire_in: 1 week
