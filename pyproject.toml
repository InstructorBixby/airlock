[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock"
version = "0.9.0"
description = "Policy gateway for model calls: classify, redact, route local or hosted, log everything"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "c01n31pan1c", email = "panic@c01n31.net"}]
keywords = ["llm", "policy", "redaction", "compliance", "gateway",
            "data-loss-prevention"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The gateway must start with nothing optional installed, so schema
# validation of the policy file is an extra rather than a dependency.
schema = ["jsonschema>=4.21"]
# scrubkit's keyed aliaser, so a value with no assignment yet can be
# given one instead of forcing the call local. Optional: without it
# airlock reuses the engagement's existing assignments and no more.
scrubkit = ["scrubkit>=0.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-PyYAML",
    "jsonschema>=4.21",
]
docs = ["mkdocs-material>=9.5", "mkdocs>=1.6"]
[project.urls]
Homepage = "http://git.c01n31.net/c01n31pan1c/airlock"
Changelog = "http://git.c01n31.net/c01n31pan1c/airlock/-/blob/main/CHANGELOG.md"

[project.scripts]
airlock = "airlock.cli:main"

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.setuptools.package-data]
airlock = ["policy.yaml", "schema/*.json", "conformance/*.yaml",
           "py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RET", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["airlock"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["airlock.classify", "airlock.policy", "airlock.route",
          "airlock.redact", "airlock.tiers", "airlock.model",
          "airlock.conformance"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["airlock"]

[tool.coverage.report]
fail_under = 88
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
