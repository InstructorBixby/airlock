# Default policy. Copy to ~/.config/airlock/policy.yaml and edit.
#
# Reading order: a tier maps to a list of candidate routes, tried top
# to bottom. The first route whose requirements can be satisfied wins.
# An empty list means refuse.
#
# Schema: airlock/schema/policy-v1.json, which the editor picks up
# from there. `airlock policy lint` checks it, and
# `airlock conformance` proves it fails closed.
version: 1

routes:
  public:
    # `available` makes the fallback real rather than theoretical: if
    # the provider is not answering, the next route is tried instead of
    # every call hanging for the request timeout.
    - backend: hosted
      require: [available]
    - backend: local

  internal:
    - backend: hosted
      require: [redacted, available]
    - backend: local

  client-confidential:
    - backend: local

  # Not a tier: the classifier's "I do not know". No route exists for
  # it and none can be written -- see the loader.
  undecided: []

backends:
  hosted:
    kind: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4o-mini
    # Dollars per million tokens. Omit a model and its calls are
    # recorded with no cost, not with a cost of zero.
    prices:
      gpt-4o-mini: {prompt: 0.15, completion: 0.60}

  local:
    kind: openai
    base_url: http://127.0.0.1:8080/v1
    api_key_env: null
    # The local tools name the model directly, so leave the field
    # alone and forward the original bytes. See docs/caching.md.
    preserve_model: true
    default_model: qwen2.5-14b-instruct
    prices:
      default: {prompt: 0.0, completion: 0.0}
    timeout: 600

limits:
  # Refuse rather than truncate. A silently shortened prompt produces
  # a confidently wrong answer about a client system.
  max_outbound_chars: 400000
