# Engagement roster. The real one is gitignored.
#
# `aliases` are unambiguous identifiers: a full client name, a ticker,
# a project code with a prefix that occurs nowhere else.
#
# `weak_aliases` are the ones that are also ordinary words. On their
# own they produce an `internal` finding (redact and send); together
# with any other finding for the same engagement they are corroborated
# and the call is confidential. See docs/aliases.md.
#
# `domains` is matched on suffix, so one entry covers every host under
# it. `nets` is matched by containment, not by text.

engagements:
  - id: halberd
    client: Halberd Industrial
    aliases: [halberd-industrial, HBRD]
    weak_aliases: [halberd]
    domains: [halberd-industrial.example, hbrd-internal.example]
    nets: [10.40.0.0/14, 192.168.70.0/24]

  - id: northwind-api
    client: Northwind Logistics
    aliases: [northwind-logistics, NWL-]
    weak_aliases: [northwind]
    domains: [northwind-logistics.example]
    nets: [172.19.0.0/16]

  - id: vantage-retest
    client: Vantage Mutual
    aliases: [vantage-mutual, VMI-]
    weak_aliases: [vantage]
    domains: [vantagemutual.example]
    nets: [10.9.0.0/16]
